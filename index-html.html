<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حساب ماجد — الناقل الخارجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f8fafc; --ink:#0f2942; --ink2:#475a70;
  --muted:#8496a8; --line:#dde4ec; --brand:#0f2942; --accent:#0e7c7b;
  --pos:#0f766e; --neg:#b42318; --warn:#b45309; --gold:#a16207;
  --r:14px; --sh:0 1px 2px rgba(15,41,66,.06),0 8px 24px rgba(15,41,66,.06);
}
html[data-theme="dark"]{
  --bg:#0b1420; --panel:#111d2c; --panel2:#0e1826; --ink:#e8eef5; --ink2:#a7b8c9;
  --muted:#6b8199; --line:#1e3247; --brand:#e8eef5; --accent:#2dd4bf;
  --pos:#34d399; --neg:#f87171; --warn:#fbbf24; --gold:#fcd34d;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Tajawal',system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.num{font-family:'IBM Plex Sans Arabic',ui-monospace,monospace;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
/* حرج: خلايا الجدول يجب أن تبقى table-cell وإلا انهار تخطيط الأعمدة وتداخلت الأرقام */
td.num,th.num{display:table-cell}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}
html[data-theme="dark"] .top{background:#0d1a28;border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#0e7c7b,#14b8a6);
  display:grid;place-items:center;flex:0 0 auto}
.logo h1{font-family:'Tajawal';font-size:19px;font-weight:800;letter-spacing:-.2px;color:#fff}
.logo p{font-size:12px;color:#9fb4c9;font-weight:500;margin-top:-2px}
html[data-theme="dark"] .logo h1{color:var(--ink)}
.spacer{flex:1}
.tbtn{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.16);padding:8px 14px;
  border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.tbtn:hover{background:rgba(255,255,255,.2)}
html[data-theme="dark"] .tbtn{color:var(--ink)}
.msel{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.18);padding:8px 12px;border-radius:10px;font-weight:600;font-size:13px}
.msel option{color:#0f2942;background:#fff}
html[data-theme="dark"] .msel{color:var(--ink)}

nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:70px;z-index:35}
.tabs-in{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.tab{padding:14px 18px;font-weight:600;font-size:14px;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1400px;margin:0 auto;padding:26px 24px 80px}
section.view{display:none;animation:fade .25s ease}
section.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h2{font-family:'Tajawal';font-size:16px;font-weight:700}
.card-h .sub{font-size:12.5px;color:var(--muted);font-weight:500}
.card-b{padding:20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:600px){.g4{grid-template-columns:1fr}}

/* ---------- KPI ---------- */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi.pos::before{background:var(--pos)} .kpi.neg::before{background:var(--neg)} .kpi.gold::before{background:var(--gold)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.5px}
.kpi .val.pos{color:var(--pos)} .kpi .val.neg{color:var(--neg)}
.kpi .meta{font-size:12px;color:var(--muted);margin-top:5px}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--panel2);color:var(--ink2);font-weight:600;font-size:12.5px;text-align:right;
  padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td.n,th.n{text-align:left}
/* الجدول ينكمش على محتواه ولا يتمدد لعرض البطاقة، والأعمدة متلاصقة */
.tw table{width:auto}
.tw table th,.tw table td{width:auto;white-space:nowrap;padding:9px 14px}
.tw table td.n,.tw table th.n{padding-inline-start:20px}
.tw table td.wrap,.tw table th.wrap{white-space:normal}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill.nisab{background:#dbeafe;color:#1d4ed8}
.pill.miya{background:#ccfbf1;color:#0f766e}
.pill.rashed{background:#fef3c7;color:#a16207}
html[data-theme="dark"] .pill.nisab{background:#1e3a5f;color:#93c5fd}
html[data-theme="dark"] .pill.miya{background:#134e4a;color:#5eead4}
html[data-theme="dark"] .pill.rashed{background:#4a3410;color:#fcd34d}

/* ---------- controls ---------- */
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp,select.inp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--panel)}
.srch{position:relative;flex:1;min-width:200px}
.srch .inp{width:100%;padding-inline-start:36px}
.srch svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{background:var(--accent);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13.5px;
  display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line);filter:none}
.btn.danger{background:var(--neg)}
.icb{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.icb:hover{background:var(--line);color:var(--ink)}
.icb.del:hover{background:#fee2e2;color:var(--neg)}
html[data-theme="dark"] .icb.del:hover{background:#4c1d1d}

/* ---------- statement ---------- */
.stmt{background:#fff;color:#0f2942;max-width:820px;margin:0 auto;padding:44px 48px;border-radius:var(--r);
  border:1px solid var(--line);box-shadow:var(--sh)}
html[data-theme="dark"] .stmt{background:#f8fafc}
.stmt-h{text-align:center;border-bottom:2.5px solid #0f2942;padding-bottom:18px;margin-bottom:26px}
.stmt-h h2{font-family:'Tajawal';font-size:25px;font-weight:800}
.stmt-h p{font-size:13.5px;color:#64748b;margin-top:4px;font-weight:500}
table.st{width:100%;border-collapse:collapse;font-size:14.5px}
table.st td{padding:8px 6px;border:none}
table.st td.n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap;width:130px}
.st .sec{font-family:'Tajawal';font-weight:800;font-size:15.5px;background:#f1f5f9;padding:9px 10px !important;
  border-top:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1}
.st .ind{padding-inline-start:26px !important;color:#475569}
.st .tot td{font-weight:700;border-top:1.5px solid #94a3b8}
.st .grand td{font-family:'Tajawal';font-weight:800;font-size:18px;border-top:2.5px solid #0f2942;
  border-bottom:2.5px double #0f2942;padding-top:12px !important;padding-bottom:12px !important}
.st .neg{color:#b42318}
.st .spacer td{height:14px}

/* ---------- misc ---------- */
.note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:13px 16px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
html[data-theme="dark"] .note{background:#3a2c08;border-color:#78621a;color:#fcd34d}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar-row .nm{width:70px;font-size:13px;font-weight:600;flex:0 0 auto}
.bar-wrap{flex:1;display:flex;flex-direction:column;gap:4px}
.bar{height:13px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{opacity:.4;margin-bottom:10px}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(15,41,66,.55);backdrop-filter:blur(3px);z-index:100;display:none;
  align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.ovl.on{display:flex}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:680px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .2s}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-8px)}to{opacity:1;transform:none}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-h h3{font-family:'Tajawal';font-size:17px;font-weight:700}
.modal-b{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.fld .inp{width:100%}
@media(max-width:600px){.modal-b{grid-template-columns:1fr}}

.toast{position:fixed;bottom:24px;inset-inline-start:24px;background:var(--brand);color:#fff;padding:13px 20px;
  border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:200;
  opacity:0;transform:translateY(14px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
html[data-theme="dark"] .toast{background:var(--accent);color:#04231f}

.ed{border:1px dashed transparent;border-radius:7px;padding:2px 7px;cursor:text;transition:.15s;
  width:90px;display:inline-block;overflow:hidden}
.ed:hover{border-color:var(--accent);background:var(--panel2)}
.ed:focus{outline:none;border-color:var(--accent);border-style:solid;background:var(--panel)}

/* ---------- trips table v2 ---------- */
.statbar{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px;background:var(--panel2)}
.statbar div{flex:1;min-width:120px;padding:11px 16px;border-inline-end:1px solid var(--line)}
.statbar div:last-child{border-inline-end:none}
.statbar .l{font-size:11.5px;color:var(--muted);font-weight:600}
.statbar .v{font-size:17px;font-weight:700}
table.trips td{border-inline-start:none}
table.trips tr.row{border-inline-end:3px solid transparent}
th.srt{cursor:pointer;user-select:none;transition:.15s}
th.srt:hover{color:var(--accent)}
th.srt .ar{opacity:.35;font-size:10px;margin-inline-start:3px}
th.srt.on{color:var(--accent)} th.srt.on .ar{opacity:1}
.route{display:flex;align-items:center;gap:7px;white-space:nowrap}
.route b{font-weight:600}
.route i{color:var(--accent);font-style:normal;font-weight:700}
.dcell{display:flex;align-items:center;gap:9px;white-space:nowrap}
.dcell .dnum{width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.dcell .dday{font-size:11px;color:var(--muted);display:block;line-height:1.2}
.gbadge{display:inline-block;padding:2.5px 9px;border-radius:7px;font-size:11.5px;font-weight:600}
.dense td{padding:5px 10px !important;font-size:12.5px}
.dense .dcell .dnum{width:22px;height:22px;font-size:11px}
.dense .dcell .dday{display:none}
.grouphd td{background:var(--panel2);font-weight:700;font-family:'Tajawal';padding:9px 12px !important;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chk{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;vertical-align:-2px}
.selbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--accent);color:#fff;
  border-radius:11px;margin-bottom:12px;font-size:13.5px;font-weight:600;flex-wrap:wrap}
.selbar button{background:rgba(255,255,255,.18);color:#fff;padding:6px 13px;border-radius:8px;font-weight:600;font-size:12.5px}
.selbar button:hover{background:rgba(255,255,255,.3)}
.drop{position:relative;display:inline-block}
.drop-m{position:absolute;top:calc(100% + 6px);inset-inline-end:0;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 12px 32px rgba(15,41,66,.16);padding:8px;min-width:190px;z-index:30;display:none}
.drop-m.on{display:block}
.drop-m label{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.drop-m label:hover{background:var(--panel2)}
@media(max-width:820px){
  .tw table.trips{width:100%}
  table.trips thead{display:none}
  table.trips tbody tr.row{display:block;border:1px solid var(--line);border-radius:12px;margin:0 0 10px;
    padding:6px 4px;background:var(--panel);border-inline-end-width:4px}
  table.trips tbody tr.row:hover{background:var(--panel)}
  table.trips tbody tr.row td{display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px dashed var(--line);padding:7px 12px;text-align:right;
    width:auto !important;white-space:normal}
  table.trips tbody tr.row td:last-child{border-bottom:none}
  table.trips tbody tr.row td::before{content:attr(data-l);color:var(--muted);font-size:11.5px;font-weight:600}
  table.trips tbody tr.row td:empty{display:none}
  table.trips tfoot td{display:block}
  .grouphd td{display:block !important}
}

/* ---------- import ---------- */
.dz{border:2.5px dashed var(--line);border-radius:16px;padding:44px 24px;text-align:center;transition:.2s;background:var(--panel2)}
.dz.hot{border-color:var(--accent);background:rgba(14,124,123,.07)}
.dz h3{font-family:'Tajawal';font-size:18px;font-weight:700;margin:12px 0 5px}
.dz p{color:var(--muted);font-size:13.5px}
.dz svg{color:var(--accent)}
.sheetc{border:1px solid var(--line);border-radius:13px;margin-bottom:14px;overflow:hidden}
.sheetc-h{padding:13px 17px;background:var(--panel2);display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.sheetc-h b{font-family:'Tajawal';font-size:14.5px}
.cnt{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px}
.cnt.ok{background:#dcfce7;color:#15803d} .cnt.dup{background:#fef3c7;color:#a16207}
.cnt.err{background:#fee2e2;color:#b42318} .cnt.sum{background:#e0e7ff;color:#4338ca}
html[data-theme="dark"] .cnt.ok{background:#14432a;color:#86efac}
html[data-theme="dark"] .cnt.dup{background:#4a3410;color:#fcd34d}
html[data-theme="dark"] .cnt.err{background:#4c1d1d;color:#fca5a5}
html[data-theme="dark"] .cnt.sum{background:#272a5e;color:#a5b4fc}
tr.st-dup td{background:#fffbeb} tr.st-err td{background:#fef2f2}
html[data-theme="dark"] tr.st-dup td{background:#2a230c} html[data-theme="dark"] tr.st-err td{background:#2c1414}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid var(--line);
  border-radius:10px;font-size:13px;cursor:pointer;background:var(--panel)}
.radios label:has(input:checked){border-color:var(--accent);background:rgba(14,124,123,.09);font-weight:600}
.radios input{accent-color:var(--accent)}
.maprow{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;padding:6px 0;font-size:13px}
.maprow .src{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= التحسين البصري ================= */
::selection{background:var(--accent);color:#fff}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.tw::-webkit-scrollbar,body::-webkit-scrollbar{height:9px;width:9px}
.tw::-webkit-scrollbar-track,body::-webkit-scrollbar-track{background:var(--panel2)}
.tw::-webkit-scrollbar-thumb,body::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.tw::-webkit-scrollbar-thumb:hover,body::-webkit-scrollbar-thumb:hover{background:var(--muted)}

.top{background:linear-gradient(115deg,#0b2036 0%,#0f2942 45%,#12384f 100%);position:relative;overflow:hidden}
.top::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(680px 150px at 88% -40%,rgba(20,184,166,.30),transparent 70%)}
html[data-theme="dark"] .top{background:linear-gradient(115deg,#0a1421,#111d2c 55%,#0e2233)}
.logo .mark{box-shadow:0 6px 18px rgba(13,148,136,.42);position:relative}
.logo .mark::after{content:'';position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(160deg,rgba(255,255,255,.34),transparent 55%)}
.top-in{position:relative;z-index:1}
.tbtn{backdrop-filter:blur(6px)}
.tbtn:active{transform:translateY(1px)}

nav.tabs{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--panel) 88%,transparent)}
.tab{position:relative}
.tab.on::after{content:'';position:absolute;inset-inline:14px;bottom:-3px;height:3px;border-radius:3px 3px 0 0;
  background:linear-gradient(90deg,var(--accent),#14b8a6)}
.tab.on{border-bottom-color:transparent}

.card{transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:0 2px 4px rgba(15,41,66,.07),0 14px 40px rgba(15,41,66,.10)}
html[data-theme="dark"] .card:hover{box-shadow:0 2px 6px rgba(0,0,0,.45),0 14px 40px rgba(0,0,0,.4)}
.card-h h2{position:relative;padding-inline-start:13px}
.card-h h2::before{content:'';position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);
  width:4px;height:17px;border-radius:3px;background:linear-gradient(180deg,var(--accent),#14b8a6)}

.kpi{transition:transform .22s,box-shadow .22s}
.kpi:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(15,41,66,.07),0 16px 36px rgba(15,41,66,.12)}
html[data-theme="dark"] .kpi:hover{box-shadow:0 16px 36px rgba(0,0,0,.45)}
.kpi::after{content:'';position:absolute;inset-inline-end:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,var(--kpiGlow,rgba(14,124,123,.11)),transparent 68%);pointer-events:none}

        vat_rate:S.settings.vatRate,currency:S.settings.currency}));
    const d=diffKeys(prev.drivers,cur.drivers);
    if(d.up.length)  ops.push(DB.from('drivers').upsert(d.up.map(id=>{
      const i=S.drivers.findIndex(x=>x.id===id); return drvRow(S.drivers[i],i);})));
    if(d.del.length) ops.push(DB.from('drivers').delete().in('id',d.del));
    const t=diffKeys(prev.trips,cur.trips);
    if(t.up.length)  ops.push(DB.from('trips').upsert(t.up.map(id=>tripRow(S.trips.find(x=>x.id===id)))));
    if(t.del.length) ops.push(DB.from('trips').delete().in('id',t.del));
    const mo=diffKeys(prev.months,cur.months);
    if(mo.up.length) ops.push(DB.from('months').upsert(mo.up.map(k=>monRow(k,S.months[k]))));
    if(mo.del.length)ops.push(DB.from('months').delete().in('key',mo.del));
    const r=diffKeys(prev.routes,cur.routes);
    if(r.up.length)  ops.push(DB.from('routes').upsert(r.up.map(k=>rteRow(k,S.routes[k]))));
    if(r.del.length) ops.push(DB.from('routes').delete().in('key',r.del));
    if(ops.length){
      MUTED_UNTIL=Date.now()+2500;
      const res=await Promise.all(ops);
      const bad=res.find(x=>x&&x.error);
      if(bad) throw new Error(bad.error.message);
    }
    LAST=cur; LASTERR=''; setStatus('ok');
  }catch(e){ LASTERR=e.message||'تعذّرت المزامنة'; setStatus('err'); }
  SYNCING=false;
  if(PENDING){ PENDING=false; scheduleSync(); }
}

async function loadCloud(){
  const uid=SESSION.user.id;
  const [me,st,dr,tr,mo,ro]=await Promise.all([
    DB.from('app_users').select('role,username').eq('user_id',uid).maybeSingle(),
    DB.from('settings').select('*').maybeSingle(),
    DB.from('drivers').select('*').order('sort_order'),
    DB.from('trips').select('*').order('trip_date'),
    DB.from('months').select('*'),
    DB.from('routes').select('*')
  ]);
  const err=[me,st,dr,tr,mo,ro].find(x=>x.error);
  if(err) throw new Error(err.error.message);
  ROLE=me.data?me.data.role:null; UNAME=me.data?me.data.username:null;
  if(!ROLE) throw new Error('حسابك غير مصرَّح له بعد. اطلب من المالك إضافتك.');
  READONLY=!(ROLE==='owner'||ROLE==='editor');
  const N={ settings:{company:'ماجد',vatRate:0.15,currency:'ر.س'}, drivers:[], trips:[], months:{}, routes:{} };
  if(st.data) N.settings={company:st.data.company,vatRate:+st.data.vat_rate,currency:st.data.currency};
  N.drivers=(dr.data||[]).map(d=>({id:d.id,name:d.name,fullName:d.full_name,vehicle:d.vehicle,color:d.color}));
  N.trips=(tr.data||[]).map(t=>({id:t.id,driverId:t.driver_id,date:t.trip_date,from:t.from_city,to:t.to_city,
    invoice:t.invoice,vehicle:t.vehicle,client:t.client,goods:t.goods,
    expense:+t.expense,revenue:+t.revenue}));
  (mo.data||[]).forEach(m=>N.months[m.key]={revenue:m.revenue||{},fileRevenue:m.file_revenue||{},
    spare:m.spare||{},salary:m.salary||{},diesel:m.diesel||{},dieselTax:m.diesel_tax||{},
    previousRevenue:+m.previous_revenue||0,deductions:m.deductions||[]});
  (ro.data||[]).forEach(x=>N.routes[x.key]={from:x.from_city,to:x.to_city,revenue:+x.revenue,
    at:(x.updated_at||'').slice(0,10)});
  if(!Object.keys(N.months).length) N.months[new Date().toISOString().slice(0,7)]=blankMonth(N.drivers);
  S=N; CLOUD=true;
  if(!S.months[CUR]) CUR=Object.keys(S.months).sort().pop();
  LAST=snap();
  LS.set(KEY,JSON.stringify(S));
  subscribeRealtime();
}

function subscribeRealtime(){
  if(!DB||DB._sub) return;
  DB._sub=DB.channel('majed-sync')
    .on('postgres_changes',{event:'*',schema:'public'},()=>{
      if(Date.now()<MUTED_UNTIL) return;          // تجاهل صدى كتابتنا
      clearTimeout(RELOAD_T);
      RELOAD_T=setTimeout(async()=>{ try{ await loadCloud(); render(); toast('وصل تحديث من جهاز آخر'); }catch(e){} },900);
    }).subscribe();
}

/* ============ COMPUTE ============ */
function prevMonthKey(mk){ const ks=Object.keys(S.months).sort(); const i=ks.indexOf(mk); return i>0?ks[i-1]:null; }
function compute(mk,_depth){
  _depth=_depth||0;
  const M=S.months[mk]; const vat=S.settings.vatRate;
  const trips=S.trips.filter(t=>t.date && t.date.slice(0,7)===mk);
  const per=S.drivers.map(d=>{
    const dt=trips.filter(t=>t.driverId===d.id);
    const tripCost=dt.reduce((s,t)=>s+(+t.expense||0),0);
    // الإيراد المعتمد = مجموع إيرادات الرحلات المُدخلة، وإن لم تُدخل يُستخدم الإيراد الشهري اليدوي
    const tripRevenue=dt.reduce((s,t)=>s+(+t.revenue||0),0);
    const noRev=dt.filter(t=>!(+t.revenue)).length;
    const manualRevenue=+(M.revenue?.[d.id]||0);
    const fromTrips=tripRevenue>0;
    const revenue=fromTrips?tripRevenue:manualRevenue;
    const spare=+(M.spare?.[d.id]||0);
    const salary=+(M.salary?.[d.id]||0);
    const diesel=+(M.diesel?.[d.id]||0);
    const autoTax=Math.round(diesel/(1+vat)*vat);
    const ov=M.dieselTax?.[d.id];
    const dieselTax=(ov===undefined||ov===null||ov==='')?autoTax:+ov;
    const totalExp=tripCost+spare+salary;
    return {d, count:dt.length, trips:dt, tripCost, revenue, tripRevenue, manualRevenue, fromTrips, noRev,
            spare, salary, diesel, dieselTax, autoTax,
            totalExp, net:revenue-totalExp, fileRevenue:+(M.fileRevenue?.[d.id]||0)};
  });
  const active=per.filter(p=>p.count>0||p.revenue||p.totalExp);
  const totalRevenue=per.reduce((s,p)=>s+p.revenue,0);
  const totalExpense=per.reduce((s,p)=>s+p.totalExp,0);
  const monthlyIncome=totalRevenue-totalExpense;
  const otherRevenue=per.reduce((s,p)=>s+p.dieselTax,0);
  // الإيرادات السابقة مرتبطة تلقائياً بصافي ربح الشهر السابق؛ تُدخل يدوياً فقط لأول شهر
  const pk=prevMonthKey(mk);
  const linked=!!pk && _depth<120;
  const previousRevenue=linked?compute(pk,_depth+1).netProfit:+(M.previousRevenue||0);
  const carried=previousRevenue+otherRevenue;
  const deductions=M.deductions||[];
  const deductionsTotal=deductions.reduce((s,x)=>s+(+x.amount||0),0);
  const netProfit=carried+monthlyIncome-deductionsTotal;
  return {mk,M,per,active,trips,totalRevenue,totalExpense,monthlyIncome,otherRevenue,
          previousRevenue,linked,prevKey:pk,carried,deductions,deductionsTotal,netProfit,
          totalTripRevenue:per.reduce((s,p)=>s+p.tripRevenue,0),
          tripsNoRevenue:per.reduce((s,p)=>s+p.noRev,0),
          totalDiesel:per.reduce((s,p)=>s+p.diesel,0),
          totalSpare:per.reduce((s,p)=>s+p.spare,0),
          totalSalary:per.reduce((s,p)=>s+p.salary,0),
          totalTripCost:per.reduce((s,p)=>s+p.tripCost,0)};
}

  coins:'<circle cx="8" cy="8" r="6"/><path d="M18.1 10.4a6 6 0 1 1-8 8"/>',
  truck:'<path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.3a4 4 0 0 0-1.2-2.8L19 9h-5v8h2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',

function kpi(lbl,val,cls,meta,vcls,ic){
  return `<div class="kpi ${cls}"><div class="kpi-top"><div><div class="lbl">${lbl}</div>
    <div class="val ${vcls||''} num">${fmt(val, Number.isInteger(val)?0:2)}</div></div>
    ${ic?`<div class="kpi-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[ic]||''}</svg></div>`:''}
    </div><div class="meta">${meta}</div></div>`;
}
function donut(parts,tot){
  const R=62,SW=26,C=2*Math.PI*R; let off=0;
  const segs=parts.map(p=>{ const len=p.v/tot*C; const s=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${p.col}"
      stroke-width="${SW}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 80 80)"/>`; off+=len; return s; }).join('');
  return `<svg width="160" height="160" viewBox="0 0 160 160">${segs}
    <text x="80" y="74" text-anchor="middle" font-size="11" fill="#8496a8" font-family="IBM Plex Sans Arabic">إجمالي المصروفات</text>
    <text x="80" y="96" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor" font-family="IBM Plex Sans Arabic">${fmt(tot)}</text></svg>`;
}

/* ---- trips ---- */
let TF={q:'',driver:'',client:'',goods:'',all:false,dense:false,group:false,

const TCOLS=[
  {k:'date',   l:'التاريخ',      s:true},

  {k:'route',  l:'المسار',       s:true},
  {k:'invoice',l:'رقم الفاتورة', s:true},
  {k:'vehicle',l:'المركبة',      s:true},
  {k:'client', l:'العميل',       s:true},
  {k:'goods',  l:'البضاعة',      s:true},
  {k:'expense',l:'المصروف',      s:true, n:true},
  {k:'revenue',l:'إيراد الرحلة',  s:true, n:true},
  {k:'profit', l:'الصافي',        s:true, n:true}
];
const AR_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function dparts(s){
  const d=new Date(s+'T00:00:00');
  if(isNaN(d)) return {n:'—',day:'',mo:''};
  return {n:d.getDate(), day:AR_DAYS[d.getDay()], mo:AR_MONTHS[d.getMonth()]};
}
const GPAL=['#2563eb','#0d9488','#d97706','#7c3aed','#db2777','#65a30d','#0891b2','#dc2626'];
function gcolor(s){ let h=0; for(const ch of String(s||'')) h=(h*31+ch.charCodeAt(0))>>>0; return GPAL[h%GPAL.length]; }
function tint(hex){ return hex+'22'; }
function vis(k){ return !TF.hidden.includes(k); }

function tripRows(c){
  let r = TF.all ? S.trips.slice() : c.trips.slice();
  if(TF.driver) r=r.filter(t=>t.driverId===TF.driver);
  if(TF.client) r=r.filter(t=>t.client===TF.client);
  if(TF.goods)  r=r.filter(t=>t.goods===TF.goods);
  if(TF.q){ const q=TF.q.trim().toLowerCase();
    r=r.filter(t=>[t.from,t.to,t.invoice,t.client,t.goods,t.vehicle,t.date,drv(t.driverId).name]
      .join(' ').toLowerCase().includes(q)); }
  const key=TF.sort, dir=TF.dir;
  const val=t=>({date:t.date, driver:drv(t.driverId).name, route:(t.from||'')+(t.to||''),
    invoice:t.invoice, vehicle:t.vehicle, client:t.client, goods:t.goods,
    expense:+t.expense||0, revenue:+t.revenue||0,
    profit:(+t.revenue||0)-(+t.expense||0)}[key]);
  r.sort((a,b)=>{ const x=val(a),y=val(b);
    if(typeof x==='number'&&typeof y==='number') return (x-y)*dir;
    return String(x??'').localeCompare(String(y??''),'ar')*dir; });
  return r;
}
function sortBy(k){ if(TF.sort===k) TF.dir*=-1; else {TF.sort=k;TF.dir=1;} render(); }

function renderTrips(c){

    <div><b>${noRev} رحلة بلا إيراد.</b> الإيراد المُدخل في الرحلات هو المعتمد في كشف الحساب —

      ${Object.keys(S.routes||{}).length?`<button class="btn ghost" style="padding:5px 12px;font-size:12.5px" onclick="applyRoutes()">تعبئة من الأسعار المحفوظة</button>`:''}
      <button class="btn ghost" style="padding:5px 12px;font-size:12.5px" onclick="go('routes')">إدارة أسعار المسارات</button></span></div>
  </div>`:''}

  ${TF.sel.length?`<div class="selbar">

    <button class="btn ghost" onclick="exportTripsCSV()">تصدير CSV</button>

  <div class="card-b" style="padding-bottom:14px">

function trRow(t,i){
  const d=drv(t.driverId), dp=dparts(t.date), gc=gcolor(t.goods);
  const on=TF.sel.includes(t.id);
  let c='';
  if(vis('date'))    c+=`<td data-l="التاريخ"><div class="dcell"><span class="dnum num">${dp.n}</span>
      <span><b class="num" style="font-size:12.5px">${esc(t.date)}</b><span class="dday">${dp.day}</span></span></div></td>`;
  if(vis('driver'))  c+=`<td data-l="السائق"><span class="pill ${d.id}">${esc(d.name)}</span></td>`;
  if(vis('route'))   c+=`<td data-l="المسار"><div class="route"><b>${esc(t.from)}</b><i>←</i><b>${esc(t.to)}</b></div></td>`;
  if(vis('invoice')) c+=`<td data-l="رقم الفاتورة" class="num" style="font-size:12.5px;color:var(--ink2)">${esc(t.invoice)||'—'}</td>`;
  if(vis('vehicle')) c+=`<td data-l="المركبة" class="num">${esc(t.vehicle)||'—'}</td>`;
  if(vis('client'))  c+=`<td data-l="العميل">${esc(t.client)||'—'}</td>`;
  if(vis('goods'))   c+=`<td data-l="البضاعة">${t.goods?`<span class="gbadge" style="background:${tint(gc)};color:${gc}">${esc(t.goods)}</span>`:'—'}</td>`;
  if(vis('expense')) c+=`<td data-l="المصروف" class="n"><span class="ed num" contenteditable="true" style="font-weight:600;color:var(--neg)"
      onblur="setTripNum('${t.id}','expense',this.textContent)"
      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${fmt(t.expense)}</span></td>`;
  if(vis('revenue')) c+=`<td data-l="إيراد الرحلة" class="n"><span class="ed num" contenteditable="true"
      style="font-weight:600;color:${+t.revenue?'var(--pos)':'var(--muted)'}${+t.revenue?'':';border-color:var(--line);border-style:dashed'}"
      title="اضغط لإدخال إيراد الرحلة — يُحفظ لهذا المسار تلقائياً"
      onblur="setTripNum('${t.id}','revenue',this.textContent)"
      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${+t.revenue?fmt(t.revenue):'0'}</span></td>`;
  if(vis('profit')){ const pf=(+t.revenue||0)-(+t.expense||0);
    c+=`<td data-l="الصافي" class="n num" style="font-weight:600;color:${!+t.revenue?'var(--muted)':pf>=0?'var(--pos)':'var(--neg)'}">${+t.revenue?fmt(pf):'—'}</td>`; }

    <td data-l="تحديد"><input type="checkbox" class="chk" ${on?'checked':''} onchange="selOne('${t.id}',this.checked)"></td>
    ${c}

/* ---- ذاكرة أسعار المسارات ---- */
function routeKey(f,t){ return norm(f)+'>'+norm(t); }
function learnRoute(f,t,v){ if(!f||!t||!(v>0)) return;
  S.routes=S.routes||{}; S.routes[routeKey(f,t)]={from:f,to:t,revenue:v,at:new Date().toISOString().slice(0,10)}; }
function lookupRoute(f,t){ if(!f||!t) return null; const r=(S.routes||{})[routeKey(f,t)]; return r?r.revenue:null; }
function applyRoutes(){
  let n=0;
  tripRows(compute(CUR)).forEach(t=>{ if(+t.revenue) return;
    const v=lookupRoute(t.from,t.to); if(v){ t.revenue=v; n++; } });
  render(); toast(n?'تمت تعبئة '+n+' رحلة من أسعار المسارات':'لا يوجد مسار محفوظ مطابق');
}

   أسعار المسارات

let RF={q:'',only:'all'};
function routeStats(){
  const m={};
  S.trips.forEach(t=>{ if(!t.from||!t.to) return; const k=routeKey(t.from,t.to);
    const e=m[k]||(m[k]={key:k,from:t.from,to:t.to,count:0,withRev:0,vals:{},last:{}});
    e.count++; const v=+t.revenue||0;
    if(v>0){ e.withRev++; e.vals[v]=(e.vals[v]||0)+1;
      if(!e.last[v]||String(t.date)>e.last[v]) e.last[v]=String(t.date); } });
  return m;
}
/* السعر الأنسب = الأكثر تكراراً، وعند التساوي الأحدث تاريخاً */
function commonVal(vals,last){
  const e=Object.entries(vals||{}); if(!e.length) return null;
  last=last||{};
  e.sort((a,b)=>b[1]-a[1] || String(last[b[0]]||'').localeCompare(String(last[a[0]]||'')) || (+b[0])-(+a[0]));
  return +e[0][0];
}
function bestVal(st){ return st?commonVal(st.vals,st.last):null; }
function routeList(){
  const saved=S.routes||{}, stats=routeStats();
  const keys=[...new Set([...Object.keys(saved),...Object.keys(stats)])];
  let list=keys.map(k=>{
    const s=saved[k], st=stats[k];
    const vals=st?st.vals:{};
    const distinct=Object.keys(vals).length;
    return {key:k, from:(s?s.from:st.from), to:(s?s.to:st.to),
      price:s?+s.revenue:null, at:s?s.at:null,
      count:st?st.count:0, withRev:st?st.withRev:0, noRev:st?st.count-st.withRev:0,
      suggest:bestVal(st), distinct,
      mismatch: s && distinct>0 && !(distinct===1 && +Object.keys(vals)[0]===+s.revenue)};
  });
  if(RF.only==='saved')   list=list.filter(r=>r.price!=null);
  if(RF.only==='unsaved') list=list.filter(r=>r.price==null);
  if(RF.only==='mismatch')list=list.filter(r=>r.mismatch);
  if(RF.q){const q=RF.q.trim(); list=list.filter(r=>(r.from+' '+r.to).includes(q));}
  return list.sort((a,b)=>b.count-a.count||String(a.from).localeCompare(String(b.from),'ar'));
}

function routeModal(key){
  const r=key?(S.routes||{})[key]:null;
  const st=key?routeStats()[key]:null;
  const from=r?r.from:(st?st.from:''), to=r?r.to:(st?st.to:'');
  const price=r?r.revenue:(st?bestVal(st)||0:0);
  const cities=[...new Set(S.trips.flatMap(x=>[x.from,x.to]).filter(Boolean))].sort();
  openModal(key?'تعديل سعر مسار':'سعر مسار جديد',`
    <div class="fld"><label>من</label><input class="inp" id="r_from" value="${esc(from)}" list="dl_rc"></div>
    <div class="fld"><label>إلى</label><input class="inp" id="r_to" value="${esc(to)}" list="dl_rc"></div>
    <datalist id="dl_rc">${cities.map(x=>`<option>${esc(x)}</option>`).join('')}</datalist>
    <div class="fld full"><label>السعر (إيراد الرحلة بالريال)</label>
      <input class="inp" type="number" step="0.01" id="r_price" value="${price}"></div>
    <div class="fld full"><label style="display:flex;align-items:center;gap:8px;font-weight:500">
      <input type="checkbox" class="chk" id="r_apply"> تطبيق هذا السعر فوراً على رحلات هذا المسار التي بلا إيراد</label></div>
  `,`<button class="btn" onclick="saveRoute('${key||''}')">حفظ</button>
     <button class="btn ghost" onclick="closeModal()">إلغاء</button>`);
}
function saveRoute(key){
  const f=$('r_from').value.trim(), t=$('r_to').value.trim(), p=+$('r_price').value||0;
  if(!f||!t){ toast('الرجاء إدخال المسار كاملاً'); return; }
  if(!(p>0)){ toast('الرجاء إدخال سعر أكبر من صفر'); return; }
  S.routes=S.routes||{};
  if(key&&key!==routeKey(f,t)) delete S.routes[key];
  learnRoute(f,t,p);
  let n=0;
  if($('r_apply').checked) S.trips.forEach(x=>{ if(!(+x.revenue)&&routeKey(x.from,x.to)===routeKey(f,t)){ x.revenue=p; n++; } });
  closeModal(); render(); toast('تم حفظ سعر '+f+' ← '+t+(n?` · عُبِّئت ${n} رحلة`:''));
}
function setRoutePrice(key,txt){
  const r=(S.routes||{})[key]; if(!r) return;
  const v=num(txt); if(v===+r.revenue){ render(); return; }
  if(!(v>0)){ render(); toast('السعر يجب أن يكون أكبر من صفر'); return; }
  learnRoute(r.from,r.to,v); render(); toast('تم تحديث السعر إلى '+fmt(v));
}
function delRoute(key){
  const r=(S.routes||{})[key]; if(!r) return;
  if(!confirm(`حذف سعر مسار ${r.from} ← ${r.to}؟\nلن تتأثر إيرادات الرحلات المُدخلة.`)) return;
  delete S.routes[key]; render(); toast('تم حذف السعر');
}
function saveSuggest(key){
  const st=routeStats()[key]; if(!st) return;
  const v=bestVal(st); if(!v) return;
  learnRoute(st.from,st.to,v); render(); toast('تم حفظ '+fmt(v)+' لمسار '+st.from+' ← '+st.to);
}
function learnAllFromTrips(){
  const stats=routeStats(); let n=0,u=0;
  Object.values(stats).forEach(s=>{ const v=bestVal(s); if(!v) return;
    const had=(S.routes||{})[s.key]; learnRoute(s.from,s.to,v); had?u++:n++; });
  render();
  toast(n||u?`تم استخراج ${n} سعر جديد${u?` وتحديث ${u}`:''}`:'لا توجد رحلات بإيراد مُدخل');
}
function applyRoutesAll(){
  let n=0;
  S.trips.forEach(t=>{ if(+t.revenue) return; const v=lookupRoute(t.from,t.to); if(v){ t.revenue=v; n++; } });
  render(); toast(n?'تمت تعبئة '+n+' رحلة من الأسعار المحفوظة':'لا يوجد مسار محفوظ مطابق');
}

const SYN={
  date:   ['التاريخ','تاريخ','تاريخ الرحلة','اليوم','date','day','trip date'],
  from:   ['من','المصدر','من مدينة','مدينة التحميل','التحميل','البداية','from','origin','source'],
  to:     ['إلى','الى','الوجهة','مدينة التفريغ','التفريغ','النهاية','to','destination','dest'],
  invoice:['رقم الفاتورة','الفاتورة','رقم البوليصة','البوليصة','بوليصة','رقم','invoice','bill','no','ref'],
  vehicle:['المركبة','مركبة','رقم المركبة','الشاحنة','السيارة','اللوحة','vehicle','truck','plate'],
  client: ['العميل','عميل','الشركة','الجهة','client','customer','company'],
  goods:  ['البضاعة','بضاعة','الصنف','نوع البضاعة','الحمولة','goods','cargo','item'],
  expense:['المصروف','مصروف','المصاريف','التكلفة','القيمة','المبلغ','الأجرة','الاجرة','expense','cost','amount','fare'],
  revenue:['إيراد الرحلة','ايراد الرحلة','الإيراد','الايراد','إيراد','ايراد','الدخل','revenue','income','freight'],
};
const SUMKEYS=[
  {re:/الإيراد\s*الشهري|الايراد\s*الشهري|إجمالي\s*الإيراد|اجمالي\s*الايراد/, f:'revenue', l:'الإيراد الشهري'},
  {re:/إجمالي\s*المصاريف|اجمالي\s*المصاريف|إجمالي\s*المصروف/,               f:'expTotal',l:'إجمالي المصاريف'},
  {re:/رحلات\s*الكاش|إجمالي\s*الكاش/,                                        f:'cashTotal',l:'رحلات الكاش'},
  {re:/^الديزل|قيمة\s*الديزل|الوقود/,                                        f:'diesel',  l:'الديزل'},
  {re:/^الصافي|صافي/,                                                        f:'net',     l:'الصافي'}
];
function norm(s){ return String(s==null?'':s).replace(/[ً-ْ‏‎]/g,'')
  .replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase(); }
function arDigits(s){ return String(s).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-0x0660)
  .replace(/[۰-۹]/g,d=>d.charCodeAt(0)-0x06F0); }
function xnum(v){
  if(v==null||v==='') return 0;
  if(typeof v==='number') return v;
  let s=arDigits(String(v)).replace(/[^\d.,()\-]/g,'').trim();
  const negp=/^\(.*\)$/.test(s); s=s.replace(/[()]/g,'');
  if(s.includes(',')&&s.includes('.')) s=s.replace(/,/g,'');
  else if(/,\d{3}\b/.test(s)) s=s.replace(/,/g,''); else s=s.replace(/,/g,'.');
  const n=parseFloat(s); if(isNaN(n)) return 0; return negp?-n:n;
}
function hasNum(v){ if(typeof v==='number') return true;
  return v!=null&&v!==''&&/\d/.test(arDigits(String(v))); }
function xdate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date && !isNaN(v)){
    return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0'); }
  if(typeof v==='number'){ if(v<1||v>60000) return null;
    const d=new Date(Date.UTC(1899,11,30)+v*86400000);
    return d.toISOString().slice(0,10); }
  let s=arDigits(String(v)).trim();
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  const d=new Date(s); if(!isNaN(d)&&/\d{4}/.test(s)) return d.toISOString().slice(0,10);
  return null;
}
function scoreHeader(row){
  let hit=0; row.forEach(c=>{ const n=norm(c); if(!n) return;
    for(const f in SYN) if(SYN[f].some(x=>norm(x)===n)){ hit++; return; } });
  return hit;
}
function mapCols(row){
  const map={};
  row.forEach((c,i)=>{ const n=norm(c); if(!n) return;
    for(const f in SYN){ if(map[f]!=null) continue;
      if(SYN[f].some(x=>norm(x)===n)){ map[f]=i; return; } } });
  row.forEach((c,i)=>{ const n=norm(c); if(!n) return;
    for(const f in SYN){ if(map[f]!=null) continue;
      if(SYN[f].some(x=>n.includes(norm(x))&&norm(x).length>2)){ map[f]=i; return; } } });
  return map;
}
function guessDriver(fname,sheet,rows,map){
  const hay=norm(fname+' '+sheet);
  for(const d of S.drivers){
    const keys=[d.name,d.fullName,d.id].filter(Boolean).map(norm);
    if(keys.some(k=>k&&hay.includes(k))) return d.id;
  }
  if(hay.includes('nisab')||hay.includes('نساب')) return S.drivers.find(d=>d.id==='nisab')?.id||null;
  if(hay.includes('miya')||hay.includes('mia'))   return S.drivers.find(d=>d.id==='miya')?.id||null;
  if(map.vehicle!=null){
    const v=rows.map(r=>String(r[map.vehicle]??'').trim()).filter(Boolean)[0];
    if(v){ const d=S.drivers.find(x=>x.vehicle&&String(x.vehicle).trim()===v); if(d) return d.id; }
  }
  return null;
}

function loadXLSX(){
  if(window.XLSX) return Promise.resolve(true);
  return new Promise(res=>{ const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=()=>res(true); s.onerror=()=>res(false); document.head.appendChild(s); });
}
function parseCSV(txt){
  const rows=[]; let f='',r=[],q=false;
  txt=txt.replace(/^﻿/,'');
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ r.push(f); f=''; }
    else if(ch==='\n'){ r.push(f); rows.push(r); r=[]; f=''; }
    else if(ch!=='\r') f+=ch; }
  if(f||r.length){ r.push(f); rows.push(r); }
  return rows;
}
async function handleFiles(files){
  const list=[...files]; if(!list.length) return;
  IMP={sheets:[],loading:true}; renderImport(compute(CUR));
  const needX=list.some(f=>!/\.csv$/i.test(f.name));
  let ok=true; if(needX) ok=await loadXLSX();
  if(needX&&!ok){ IMP={error:'تعذّر تحميل مكتبة قراءة الإكسل (تحقق من الإنترنت). يمكنك تحويل الملف إلى CSV واستيراده.'};
    renderImport(compute(CUR)); return; }
  const sheets=[];
  for(const f of list){
    try{
      let raws=[];
      if(/\.csv$/i.test(f.name)){ raws=[{name:f.name.replace(/\.csv$/i,''), rows:parseCSV(await f.text())}]; }
      else{ const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
        raws=wb.SheetNames.map(n=>({name:n, rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',blankrows:false,raw:true})})); }
      for(const rw of raws){ const s=buildSheet(f.name,rw.name,rw.rows); if(s) sheets.push(s); }
    }catch(e){ sheets.push({file:f.name,name:'—',error:'تعذّرت قراءة الملف: '+e.message,rows:[],summary:{}}); }
  }
  IMP={sheets, policy:'skip'}; renderImport(compute(CUR));
}
function buildSheet(fileName,sheetName,raw){
  if(!raw||!raw.length) return null;
  let hi=0,best=0;
  for(let i=0;i<Math.min(raw.length,12);i++){ const sc=scoreHeader(raw[i]); if(sc>best){best=sc;hi=i;} }
  if(best<2) return {file:fileName,name:sheetName,error:'لم يتم التعرف على أعمدة الرحلات في هذه الورقة',rows:[],summary:{},map:{},header:raw[0]||[]};
  const header=raw[hi], map=mapCols(header);
  const {rows,summary}=buildRows(raw,hi,map);
  const driverId=guessDriver(fileName,sheetName,raw.slice(hi+1),map);
  return {file:fileName,name:sheetName,map,header,raw,hi,rows,summary,driverId,
          guessed:!!driverId, months:[...new Set(rows.filter(r=>r.date).map(r=>r.date.slice(0,7)))].sort()};
}
function buildRows(raw,hi,map){
  const body=raw.slice(hi+1), summary={}, rows=[];
  for(const r of body){
    if(!r || r.every(c=>c===''||c==null)) continue;
    // summary row?
    let isSum=false;
    for(const cell of r){ const n=norm(cell); if(!n) continue;
      const k=SUMKEYS.find(s=>s.re.test(n));
      if(k){ const v=r.find(x=>hasNum(x)&&norm(x)!==n); summary[k.f]={label:k.l,value:xnum(v)}; isSum=true; break; } }
    if(isSum) continue;
    const g=f=>map[f]!=null?r[map[f]]:'';
    const date=xdate(g('date'));
    const o={date, from:String(g('from')??'').trim(), to:String(g('to')??'').trim(),
      invoice:String(g('invoice')??'').trim(), vehicle:String(g('vehicle')??'').trim(),
      client:String(g('client')??'').trim(), goods:String(g('goods')??'').trim(),
      expense:xnum(g('expense')), revenue:xnum(g('revenue'))};
    if(!date){ if(!o.from&&!o.to&&!o.expense) continue;
      rows.push({...o, _st:'err', _why:'تاريخ غير صالح: '+String(g('date')||'فارغ')}); continue; }
    rows.push({...o,_st:'new'});
  }
  return {rows,summary};
}
function markDups(sh){
  sh.rows.forEach(r=>{ if(r._st==='err') return;
    const dup=S.trips.some(t=>t.driverId===sh.driverId && t.date===r.date &&
      String(t.invoice||'').trim()===String(r.invoice||'').trim());
    r._st = dup?'dup':'new'; });
}

function applyImport(){
  IMP_UNDO={trips:clone(S.trips), months:clone(S.months), drivers:clone(S.drivers)};
  const pol=IMP.policy||'skip';
  const good=IMP.sheets.filter(s=>!s.error&&s.driverId);
  // ensure drivers + months
  good.forEach(sh=>{
    if(sh.driverId==='__new'){ const id=uid();
      S.drivers.push({id,name:sh.name,fullName:sh.name,vehicle:'',color:GPAL[S.drivers.length%GPAL.length]});
      sh.driverId=id; }
    (sh.months||[]).forEach(mk=>{ if(!S.months[mk]) newMonth(mk); });
  });
  if(pol==='replace'){
    const pairs=new Set(); good.forEach(sh=>(sh.months||[]).forEach(mk=>pairs.add(sh.driverId+'|'+mk)));
    S.trips=S.trips.filter(t=>!pairs.has(t.driverId+'|'+String(t.date).slice(0,7)));
  }
  good.forEach(sh=>markDups(sh));
  let added=0, skipped=0;
  good.forEach(sh=>{
    sh.rows.forEach(r=>{
      if(r._st==='err'){ skipped++; return; }
      if(r._st==='dup'&&pol==='skip'){ skipped++; return; }
      const rev=r.revenue||lookupRoute(r.from,r.to)||0;
      S.trips.push({id:uid(), driverId:sh.driverId, date:r.date, from:r.from, to:r.to, invoice:r.invoice,

        expense:r.expense, revenue:rev});

    });

    const mk=(sh.months||[])[0]; if(!mk) return; const M=S.months[mk];

    if(sh.summary.diesel){ M.diesel=M.diesel||{}; M.diesel[sh.driverId]=sh.summary.diesel.value; }
  });
  const mks=[...new Set(good.flatMap(s=>s.months||[]))].sort();
  if(mks.length) CUR=mks[mks.length-1];
  IMP=null; TF.sel=[]; go('trips');

/* ---- طباعة الكشف في صفحة A4 عمودية واحدة ---- */
const MM=96/25.4;                    // بكسل لكل مليمتر عند 96dpi
const PAGE_MARGIN=11;                // يطابق @page margin
function fitStatement(){
  const box=$('stmtBox'); if(!box) return;
  box.style.zoom=''; box.style.width='';
  box.classList.add('compact');                // نفس تنسيق الورق قبل القياس
  const availW=(210-PAGE_MARGIN*2)*MM;
  const availH=(297-PAGE_MARGIN*2)*MM;
  box.style.width=availW+'px';
  const h=box.scrollHeight, w=box.scrollWidth;
  const s=Math.min(1, availH/h, availW/w);
  box.style.zoom = s<1 ? (Math.floor(s*1000)/1000) : '';
  return {h,w,s,fitted:h*s<=availH+1};
}
function unfitStatement(){ const box=$('stmtBox');
  if(box){ box.style.zoom=''; box.style.width=''; box.classList.remove('compact'); } }
function printStatement(){
  if(ACTIVE!=='stmt') go('stmt');
  fitStatement();
  setTimeout(()=>{ window.print(); setTimeout(unfitStatement,300); },60);
}
window.addEventListener('beforeprint',fitStatement);
window.addEventListener('afterprint',unfitStatement);

              <input class="inp num" id="nu_user" placeholder="اسم المستخدم" style="direction:ltr;text-align:left;max-width:170px">

            </div>
            <div id="nu_msg" style="font-size:12.5px;min-height:17px;margin-top:6px"></div>
          </div>`:''}
      `:`
        <div class="note">تعمل الآن في <b>الوضع المحلي</b> — البيانات في هذا المتصفح فقط ولا تُزامَن.</div>
        <div class="ctl" style="margin-top:12px"><button class="btn" onclick="showAuth()">تسجيل الدخول للمزامنة</button></div>
      `}
    </div></div>

    <div class="card"><div class="card-h"><h2>البيانات</h2></div><div class="card-b">
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">نسخة احتياطية إضافية بصيغة JSON — مفيدة حتى مع التخزين السحابي.</p>
      <div class="ctl">
        <button class="btn" onclick="exportJSON()">تصدير نسخة احتياطية (JSON)</button>

        عدد الأشهر: <b class="num">${Object.keys(S.months).length}</b> ·
        عدد الرحلات: <b class="num">${S.trips.length}</b> ·
        عدد السائقين: <b class="num">${S.drivers.length}</b></div>
    </div></div>

    <div class="card" style="grid-column:1/-1"><div class="card-h"><h2>الأشهر المسجّلة</h2></div>
      <div class="tw"><table><thead><tr><th>الشهر</th><th class="n">الرحلات</th><th class="n">الإيرادات</th>
        <th class="n">المصروفات</th><th class="n">الدخل الشهري</th><th class="n">صافي الربح</th><th></th></tr></thead><tbody>
        ${Object.keys(S.months).sort().reverse().map(k=>{const x=compute(k);
          return `<tr><td><b>${monthLabel(k)}</b> <span class="num" style="color:var(--muted);font-size:12px">${k}</span></td>
          <td class="n num">${x.trips.length}</td><td class="n num">${fmt(x.totalRevenue)}</td>
          <td class="n num">${fmt(x.totalExpense)}</td><td class="n num">${fmt(x.monthlyIncome)}</td>
          <td class="n num" style="font-weight:700;color:var(--gold)">${fmt(x.netProfit)}</td>
          <td><button class="btn ghost" style="padding:5px 12px;font-size:12.5px" onclick="CUR='${k}';go('stmt')">عرض</button></td></tr>`}).join('')}

  </div>`;
}

/* ============ MONTHS ============ */
function newMonth(mk,copyFrom){
  const src=copyFrom?S.months[copyFrom]:null;
  const z={}; S.drivers.forEach(d=>z[d.id]=0);
  S.months[mk]={ revenue:{...z}, fileRevenue:{...z}, spare:{...z},
    salary: src?{...src.salary}:{...z}, diesel:{...z},
    previousRevenue:0, deductions:[] };   // الرصيد السابق يُشتق تلقائياً من الشهر السابق
}
function addMonth(){
  const keys=Object.keys(S.months).sort(); const last=keys[keys.length-1];
  const [y,m]=last.split('-').map(Number); const d=new Date(y,m,1);
  const mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const v=prompt('الشهر الجديد (YYYY-MM):',mk); if(!v||!/^\d{4}-\d{2}$/.test(v)){ if(v)toast('صيغة غير صحيحة'); return; }
  if(S.months[v]){ CUR=v; render(); toast('الشهر موجود مسبقاً'); return; }
  newMonth(v,last); CUR=v; render();
  toast('تم إنشاء '+monthLabel(v)+' — الرصيد السابق مرتبط تلقائياً بصافي ربح الشهر السابق');
}

/* ============ IO ============ */
function dl(name,content,type){
  const b=new Blob(['﻿'+content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}
function exportJSON(){ dl('majed-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,2),'application/json'); toast('تم تصدير النسخة الاحتياطية'); }
function csvOf(list,name){
  const h=['التاريخ','السائق','من','إلى','رقم الفاتورة','المركبة','العميل','البضاعة','المصروف','إيراد الرحلة','الصافي'];
  const rows=list.slice().sort((a,b)=>a.date<b.date?-1:1)
    .map(t=>[t.date,drv(t.driverId).name,t.from,t.to,t.invoice,t.vehicle,t.client,t.goods,
             t.expense,t.revenue||0,(+t.revenue||0)-(+t.expense||0)]);
  const csv=[h,...rows].map(r=>r.map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  dl(name,csv,'text/csv;charset=utf-8'); toast('تم تصدير '+list.length+' رحلة');
}
function exportTripsCSV(){ csvOf(S.trips,'majed-trips.csv'); }
function importJSON(el){
  const f=el.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d.months||!d.trips) throw 0;
      if(cloudOn()) mergeImport(d);
      else { S=d; CUR=Object.keys(S.months).sort().pop(); render(); toast('تم استيراد البيانات بنجاح'); }
    }catch(e){ toast('ملف غير صالح'); } el.value=''; };
  r.readAsText(f);
}
/* الدمج في السحابة: يضيف الناقص فقط ولا يستبدل ولا يحذف شيئاً موجوداً في القاعدة */
async function mergeImport(d){
  if(!canWrite()){ toast('ليس لديك صلاحية التعديل'); return; }
  const n={drivers:0,trips:0,months:0,routes:0}, skip={trips:0,months:0};
  (d.drivers||[]).forEach(x=>{ if(!S.drivers.some(y=>y.id===x.id)){ S.drivers.push(x); n.drivers++; } });
  const have=new Set(S.trips.map(t=>t.id));
  (d.trips||[]).forEach(t=>{ if(have.has(t.id)) skip.trips++; else { S.trips.push(t); n.trips++; } });
  Object.entries(d.months||{}).forEach(([k,v])=>{
    if(S.months[k]) skip.months++; else { S.months[k]=v; n.months++; } });
  S.routes=S.routes||{};
  Object.entries(d.routes||{}).forEach(([k,v])=>{ if(!S.routes[k]){ S.routes[k]=v; n.routes++; } });
  if(!n.trips&&!n.months&&!n.routes&&!n.drivers){
    toast('لا يوجد جديد في الملف — كل شيء موجود في القاعدة'); return; }
  CUR=Object.keys(S.months).sort().pop();
  LAST={};                       // إضافة فقط: لا يُحذف أي صف من القاعدة
  render(); await runSync();
  if(LASTERR){ toast('فشل الرفع: '+LASTERR); return; }
  const parts=[]; if(n.trips)parts.push(n.trips+' رحلة'); if(n.months)parts.push(n.months+' شهر');
  if(n.routes)parts.push(n.routes+' مسار'); if(n.drivers)parts.push(n.drivers+' سائق');
  toast('تم رفع '+parts.join(' · ')+(skip.trips||skip.months?` (تُخطّي ${skip.trips} رحلة و${skip.months} شهر موجودة مسبقاً)`:''));
}
function resetAll(){ if(!confirm('سيتم حذف كل التعديلات والعودة للبيانات الأصلية. متابعة؟')) return;
  LS.del(KEY); LS.del(KEY+'_m'); load(); render(); toast('تمت الاستعادة'); }
